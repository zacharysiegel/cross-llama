[package]
name = "cross-llama"
version = "0.2.0"
edition = "2024"
description = "Runs a GGUF language model from Rust behind one async API: llama.cpp on targets other than wasm32, wllama in the browser"
license = "MIT"
repository = "https://github.com/zacharysiegel/cross-llama"
readme = "README.md"
keywords = ["llm", "llama", "gguf", "wasm", "inference"]
categories = ["api-bindings", "wasm"]

[features]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
futures = { version = "0.3.*", default-features = false, features = ["std"] }
minijinja = { version = "3.0.*", features = ["json", "loop_controls", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.0.*", features = ["pycompat"] }
minimer = "2.2.*"
serde_json = "1.0.*"

# llama-cpp-sys-2 compiles llama.cpp with CMake and a native C++ compiler, which cannot target wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
llama-cpp-2 = { version = "0.1.*", features = ["llguidance"] }
llguidance = "1.9.*"
toktrie = "1.9.*"

# Metal exists only on Apple's operating systems.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-2 = { version = "0.1.*", features = ["metal"] }

# wllama, which these call, is JavaScript and runs only in a browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.*"
serde = { version = "1.0.*", features = ["derive"] }
wasm-bindgen = "0.2.*"
wasm-bindgen-futures = "0.4.*"
web-sys = { version = "0.3.*", features = ["AbortController", "AbortSignal"] }

[dev-dependencies]
futures = { version = "0.3.*", default-features = false, features = ["std", "executor"] }

# The browser tests run through wasm-bindgen-test's runner, which drives a browser.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.*"
